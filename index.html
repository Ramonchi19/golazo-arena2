<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b3f8f">
<title>Titan Crashers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a5cc0;--bg2:#2453b0;--navy:#0d1f4a;--navy2:#162c63;--panel:#1d3a7f;--line:#0b1a3d;--text:#fff;--muted:#b9c9ee;--gold:#ffc92e;--green:#3ccf5a;--red:#ff4d5e;--purple:#b84dff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2a5cc0;}}
:root[data-theme="dark"]{--bg:#2a5cc0;}:root[data-theme="light"]{--bg:#2a5cc0;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:block;src:url(assets/fonts/LilitaOne-Regular.ttf) format('truetype')}
body{background:#123177;color:var(--text);font-family:'Lilita One',"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hide{display:none!important}
small,.sys{font-family:system-ui,sans-serif}
/* texto estilo clash: contorno + sombra */
.ct,h2,h3,.btn,.tab b,.tb-num,.lvl-b,.cname{paint-order:stroke fill;-webkit-text-stroke:3px #0a1636;text-shadow:0 2px 0 #0a1636}
/* ---------- META ---------- */
#meta{position:fixed;inset:0;display:flex;flex-direction:column;max-width:540px;margin:0 auto;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
#meta::before{content:'';position:absolute;inset:-60%;background:repeating-conic-gradient(var(--bg) 0 25%,var(--bg2) 0 50%) 0 0/64px 64px;transform:rotate(45deg);z-index:0;pointer-events:none}
#meta>*{position:relative;z-index:1}
/* barra superior */
#topbar{display:flex;align-items:center;gap:6px;padding:7px 8px 5px}
.lvl{display:flex;align-items:center;flex:1.25;min-width:0;background:rgba(10,22,54,.55);border-radius:10px;height:30px;padding-right:6px;border:2px solid #0a1636}
.lvl-b{width:38px;height:38px;margin:-6px 4px -6px -6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(#5fb0ff,#2b6fe0);clip-path:polygon(50% 0,100% 22%,100% 70%,50% 100%,0 70%,0 22%);}
.xp{flex:1;height:14px;background:#0a1636;border-radius:7px;overflow:hidden;position:relative}
.xp i{display:block;height:100%;background:linear-gradient(#7fd0ff,#2f8cff)}
.xp span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.res{display:flex;align-items:center;background:rgba(10,22,54,.55);border:2px solid #0a1636;border-radius:10px;height:30px;flex:1;min-width:0}
.res .plus{width:26px;height:26px;margin:0 4px 0 1px;border-radius:7px;background:linear-gradient(#6fe36f,#22a33a);border:2px solid #0a3a12;font-size:18px;line-height:20px;text-align:center;flex:none;box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
.tb-num{flex:1;text-align:right;font-size:15px;padding-right:4px;white-space:nowrap;overflow:hidden}
.res .ic{font-size:18px;margin-right:4px;filter:drop-shadow(0 2px 0 #0a1636)}
#screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:4px 10px 16px;display:none;-webkit-overflow-scrolling:touch}
.screen.on{display:block;animation:slideIn .22s ease-out}
.screen.on.left{animation-name:slideInL}
@keyframes slideIn{from{opacity:.3;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes slideInL{from{opacity:.3;transform:translateX(-24px)}to{opacity:1;transform:none}}
/* barra inferior */
#nav{display:flex;align-items:stretch;background:#13306e;border-top:3px solid #0a1636;height:74px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:2px solid #0a1636;background:linear-gradient(#1f4593,#173777);position:relative;transition:flex .2s}
#nav button:last-child{border-right:0}
#nav button .ni{font-size:28px;filter:drop-shadow(0 3px 0 #0a1636);transition:transform .2s}
#nav button .nl{display:none;font-size:13px;margin-top:1px}
#nav button.on{flex:1.5;background:linear-gradient(#5aa0ff,#2f6fe0);margin-top:-12px;border-radius:12px 12px 0 0;border:3px solid #0a1636;border-bottom:0}
#nav button.on .ni{transform:scale(1.25) translateY(-2px)}
#nav button.on .nl{display:block}
#nav .dot{position:absolute;top:6px;right:18%;background:var(--green);border:2px solid #0a1636;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:14px;text-align:center}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:10px 18px;font-size:18px;color:#fff;border:3px solid #0a1636;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35),0 4px 0 #0a1636;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22),0 1px 0 #0a1636}
.btn.y{background:linear-gradient(#ffd84a,#ffaf0f)}.btn.g{background:linear-gradient(#6fe36f,#25a83c)}.btn.b{background:linear-gradient(#5fb0ff,#2a6fe0)}.btn.r{background:linear-gradient(#ff7a85,#d8293c)}.btn.p{background:linear-gradient(#d68bff,#8a2ed6)}
.btn.sm{padding:6px 12px;font-size:15px}
button[disabled]{filter:grayscale(.85) brightness(.8);pointer-events:none}
.panel{background:rgba(10,22,54,.45);border:3px solid #0a1636;border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.hdr{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 8px;font-size:21px}
.hdr small{font-size:12px;color:var(--muted)}
h2{margin:6px 0 8px;font-size:22px;font-weight:400;text-align:center}
/* v85: íconos dibujados y botones con rebote (estilo Brawl) */
.ico{display:inline-block;vertical-align:middle;overflow:visible;pointer-events:none}
.emo{display:inline-flex;vertical-align:-4px;margin:0 1px}.emo .ico{width:1.15em;height:1.15em;min-width:16px;min-height:16px}
.prs{scale:.92;transition:scale .05s}
.pop{animation:popb .3s cubic-bezier(.3,1.9,.5,1)}
@keyframes popb{0%{scale:.92}55%{scale:1.07}100%{scale:1}}
#nav button .ni{display:flex;filter:none;height:38px;align-items:center}
#nav button:not(.on) .ni{opacity:.85}
.res .ic{display:flex;margin-right:3px;filter:none}
.sq{display:flex;align-items:center;justify-content:center;padding:0}
.round{font-size:0}.round .ico{margin-top:-4px}.round span{font-size:11px}
.road-btn{display:flex;align-items:center;justify-content:center;font-size:0}
.mclose{display:flex;align-items:center;justify-content:center;padding:0}
.pfs>span{display:flex;align-items:center}
/* títulos de pantalla como cintas inclinadas */
#meta h2{position:relative;display:table;margin:8px auto 10px;padding:3px 22px 5px;z-index:0}
#meta h2::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(#ffd84a,#ffae0c);border:3px solid #0a1636;border-radius:8px;transform:skewX(-12deg);box-shadow:0 4px 0 #0a1636,inset 0 3px 0 rgba(255,255,255,.45)}
.mtitle{position:relative;display:table;margin:-2px auto 12px;padding:2px 20px 4px;z-index:0}
.mtitle::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(#5fb0ff,#2a6fe0);border:3px solid #0a1636;border-radius:8px;transform:skewX(-12deg);box-shadow:0 3px 0 #0a1636,inset 0 3px 0 rgba(255,255,255,.35)}

h3{margin:14px 0 7px;font-size:17px;font-weight:400}
/* inicio */
.hb-row{display:flex;gap:6px;align-items:stretch;margin-top:2px}
.banner{flex:1;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:3px solid #0a1636;text-align:left;background:#13306e;box-shadow:0 4px 0 #0a1636}
.bn-art{height:56px;background:linear-gradient(115deg,var(--bc) 0 62%,transparent 62%),repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 6px,transparent 6px 12px),linear-gradient(var(--bc),#0d1f4a);position:relative;display:flex;align-items:center;padding-left:10px;clip-path:polygon(0 0,100% 0,92% 100%,0 100%)}
.bn-av{font-size:36px;filter:drop-shadow(0 3px 0 #0a1636);animation:bob 3s ease-in-out infinite}
.bn-info{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 6px;gap:6px}
.bn-info b{font-size:17px;display:block;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn-info small{font-size:11px;color:var(--muted);display:block}
.bn-tro{font-size:20px;color:var(--gold);white-space:nowrap}
.hb-side{display:grid;grid-template-columns:1fr;gap:5px}
.sq{width:46px;height:40px;border-radius:10px;background:linear-gradient(#4e8fe8,#2a5fc0);border:3px solid #0a1636;font-size:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 3px 0 #0a1636;position:relative}
.arena-wrap{position:relative;margin:8px 0 2px;display:flex;flex-direction:column;align-items:center}
.round{position:absolute;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffe27a,#f5a300);border:3px solid #0a1636;font-size:26px;box-shadow:0 4px 0 #0a1636,inset 0 -4px 0 rgba(0,0,0,.2);z-index:3;display:flex;align-items:center;justify-content:center}
.round span{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;-webkit-text-stroke:2.5px #0a1636;paint-order:stroke fill}
.round.l1{left:2px;top:10px}.round.l2{left:2px;top:92px;background:radial-gradient(circle at 40% 35%,#9fd8ff,#2f7bff)}.round.r2{right:2px;top:calc(clamp(44px,7vh,58px) + 28px);background:radial-gradient(circle at 40% 35%,#ffe08a,#e08a00)}
.round.r1{right:2px;top:10px;background:radial-gradient(circle at 40% 35%,#e4a8ff,#8a2ed6)}
.dio{width:auto;min-width:250px;height:auto;min-height:220px;perspective:650px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.plat{width:200px;height:250px;transform:rotateX(52deg) rotateZ(0deg);transform-style:preserve-3d;position:relative;border-radius:16px;background:var(--st);box-shadow:0 0 0 4px #0a1636,0 26px 0 var(--side),0 26px 0 4px #0a1636,0 60px 50px rgba(0,0,0,.45);animation:dioFloat 4s ease-in-out infinite}
@keyframes dioFloat{50%{transform:rotateX(52deg) translateZ(8px)}}
.plat .seats{position:absolute;inset:0;border-radius:16px;background:radial-gradient(circle,var(--s1) 2.2px,transparent 2.6px) 0 0/9px 9px,radial-gradient(circle,var(--s2) 2.2px,transparent 2.6px) 4.5px 4.5px/9px 9px;opacity:.95}
.pitch{position:absolute;inset:24px 22px;border-radius:6px;background:repeating-linear-gradient(var(--g1) 0 22px,var(--g2) 22px 44px);border:3px solid var(--ln);box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.pitch::before{content:'';position:absolute;left:0;right:0;top:50%;height:3px;background:var(--ln);transform:translateY(-50%)}
.pitch::after{content:'';position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border:3px solid var(--ln);border-radius:50%}
.pbox{position:absolute;left:28%;right:28%;height:30px;border:3px solid var(--ln)}.pbox.t{top:-3px;border-top:0}.pbox.b{bottom:-3px;border-bottom:0}
.goal{position:absolute;left:38%;right:38%;height:10px;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 6px);border:2px solid #fff}.goal.t{top:-14px}.goal.b{bottom:-14px}
.bill{position:absolute;transform:rotateX(-52deg);transform-origin:50% 100%;font-size:26px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.4))}
.bill.ball{left:50%;top:50%;margin:-24px 0 0 -12px;font-size:22px;animation:hop 1.3s ease-in-out infinite}
@keyframes hop{50%{transform:rotateX(-52deg) translateY(-18px)}}
.light{position:absolute;width:10px;height:10px;border-radius:50%;background:#fff6c8;box-shadow:0 0 18px 8px rgba(255,246,200,.7);animation:flick 2s infinite}
@keyframes flick{50%{opacity:.75}}
.arena-name{margin-top:-6px;font-size:22px;text-align:center}
.arena-name small{display:block;font-size:12px;color:var(--muted)}
.tro-bar{display:flex;align-items:center;gap:6px;width:82%;margin-top:6px;font-size:14px}
.tro-bar .bar{flex:1;height:16px;background:#0a1636;border-radius:8px;overflow:hidden;border:2px solid #0a1636;position:relative}
.tro-bar .bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#4fa8ff 0 18%,#3b8ff0 18% 19%);border-radius:6px}
.pack-row{display:flex;justify-content:center;gap:7px;margin:12px auto 4px;padding:7px;background:rgba(10,22,54,.4);border:3px solid #0a1636;border-radius:16px;width:fit-content}
.pslot{width:62px;height:76px;border-radius:10px;background:rgba(10,22,54,.6);border:2px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);text-align:center;font-family:system-ui,sans-serif}
.pslot.full{border:0;background:none;animation:packBob 2.4s ease-in-out infinite}
.pslot.full:nth-child(2){animation-delay:.3s}.pslot.full:nth-child(3){animation-delay:.6s}.pslot.full:nth-child(4){animation-delay:.9s}
@keyframes packBob{50%{transform:translateY(-4px) rotate(-2deg)}}
.battle-row{display:flex;align-items:stretch;gap:6px;margin-top:10px}
.deck-btn{width:80px;border-radius:12px;background:linear-gradient(#4e8fe8,#2a5fc0);border:3px solid #0a1636;box-shadow:0 4px 0 #0a1636;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:2px}
.deck-btn .mini{width:46px}
.deck-btn small{font-size:10px;color:#fff;font-family:'Lilita One',sans-serif;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.battle-btn{flex:1;border-radius:14px;border:3px solid #0a1636;background:linear-gradient(#ffd84a,#ffae0c);box-shadow:inset 0 -6px 0 rgba(170,90,0,.45),inset 0 3px 0 rgba(255,255,255,.55),0 6px 0 #0a1636;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px;position:relative;overflow:hidden}
.battle-btn b{font-size:34px;line-height:1}
.battle-btn small{font-size:12px;font-family:'Lilita One',sans-serif;color:#fff;-webkit-text-stroke:2.5px #0a1636;paint-order:stroke fill;margin-top:2px}
.battle-btn::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.battle-btn:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 rgba(170,90,0,.45),0 2px 0 #0a1636}
.road-btn{width:72px;border-radius:12px;background:linear-gradient(#4e8fe8,#2a5fc0);border:3px solid #0a1636;box-shadow:0 4px 0 #0a1636;font-size:36px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){.plat,.bill.ball,.pslot.full,.battle-btn::after,.bn-av{animation:none!important}}
/* sobres */
.pack{--c1:#d08a4a;--c2:#7a4416;width:100%;aspect-ratio:.72;border-radius:8px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));border:2px solid #0a1636;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 3px 0 #0a1636;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pack::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 4px,transparent 4px 10px)}
.pack::after{content:'';position:absolute;top:-20%;bottom:-20%;width:35%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 3.2s ease-in-out infinite}
.pack .pk-logo{font-size:min(28px,9vw);z-index:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.pack .pk-n{z-index:1;font-size:10px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill;text-align:center;line-height:1}
.pack .pk-top{position:absolute;top:0;left:0;right:0;height:14%;background:rgba(0,0,0,.18);border-bottom:2px dashed rgba(255,255,255,.4)}
.pk-plata{--c1:#f1f5fb;--c2:#7d8aa3}.pk-oro{--c1:#ffe27a;--c2:#c98a00}.pk-leyenda{--c1:#e3a6ff;--c2:#4a1a8a}.pk-bronce{--c1:#e09a5a;--c2:#7a4416}
/* cartas */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cw{display:flex;flex-direction:column;gap:3px;position:relative}
.card{position:relative;width:100%;aspect-ratio:.78;border-radius:9px;border:3px solid var(--rc,#8aa0c8);background:linear-gradient(170deg,#4f74c9,#24418c);overflow:hidden;box-shadow:0 0 0 2px #0a1636,0 3px 0 2px #0a1636;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.25) 50%,transparent 65%);transform:translateX(-120%);pointer-events:none}
.cw:hover .card::after,.card.shine::after{animation:cardShine 1s}
@keyframes cardShine{to{transform:translateX(120%)}}
.r-comun{--rc:#9fb4d8}.r-rara{--rc:#ff9f1a}.r-epica{--rc:#c06bff}.r-legendaria{--rc:#ffe066}
.card.r-rara{background:linear-gradient(170deg,#e08a2a,#7a3a10)}.card.r-epica{background:linear-gradient(170deg,#9a4dff,#3a1680)}
.card.r-legendaria{background:linear-gradient(170deg,#47b8e8,#7a3ad8 55%,#e0a300)}
.card.r-legendaria::before{content:'';position:absolute;inset:-3px;border-radius:9px;padding:3px;background:conic-gradient(#ffe066,#ff6ad5,#6fe3ff,#7cff8a,#ffe066);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spinG 3s linear infinite;pointer-events:none}
@keyframes spinG{to{filter:hue-rotate(360deg)}}
.c-face{width:84%;flex:1;display:flex;align-items:flex-end}.c-face svg{width:100%;display:block}
.c-ic{flex:1;display:flex;align-items:center;font-size:30px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.c-ovr{position:absolute;top:2px;left:4px;font-size:15px;color:var(--gold);-webkit-text-stroke:2.5px #0a1636;paint-order:stroke fill;line-height:1}
.c-pos{position:absolute;top:3px;right:3px;font-size:9px;background:rgba(10,22,54,.75);border-radius:4px;padding:1px 3px}
.p-DEL{color:#ff9a9a}.p-MED{color:#8af0a8}.p-DEF{color:#8fd0ff}.p-POR{color:#ffd88a}
.drop{position:absolute;top:-2px;left:-2px;width:22px;height:26px;background:radial-gradient(circle at 40% 30%,#ffb8f6,#b02ed8);clip-path:path('M11 0 C11 0 22 12 22 17 A11 9 0 0 1 0 17 C0 12 11 0 11 0Z');display:flex;align-items:flex-end;justify-content:center;font-size:12px;padding-bottom:3px;z-index:2;-webkit-text-stroke:2px #3a0a50;paint-order:stroke fill}
.c-lvl{width:100%;text-align:center;font-size:11px;background:rgba(10,22,54,.82);padding:2px 0 1px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.cname{font-size:10.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:2.5px #0a1636}
.cp{height:14px;background:#0a1636;border-radius:7px;position:relative;overflow:hidden;border:1px solid #0a1636}
.cp i{display:block;height:100%;background:linear-gradient(#5fb0ff,#2a6fe0)}
.cp.up i{background:linear-gradient(#7cf07c,#28a83c)}
.cp em{position:absolute;inset:0;font-style:normal;font-size:9.5px;text-align:center;line-height:13px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.cp .ar{position:absolute;left:1px;top:0;font-size:10px;line-height:13px}
.cw.locked .card{filter:grayscale(1) brightness(.5)}
.cw.locked .lockic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;z-index:2}
.cw.insq .card{box-shadow:0 0 0 2px #0a1636,0 0 0 5px #3ccf5a,0 3px 0 5px #0a1636}
.newb{position:absolute;top:-6px;right:-4px;background:var(--red);border:2px solid #0a1636;border-radius:7px;font-size:10px;padding:0 4px;z-index:3;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
/* plantilla */
.forms{display:flex;gap:5px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.forms::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:6px 10px;border-radius:10px;background:linear-gradient(#3b6fd0,#244e9e);border:2px solid #0a1636;font-size:13px;box-shadow:0 3px 0 #0a1636;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.fchip small{display:block;font-size:10px;color:var(--muted);-webkit-text-stroke:0}
.fchip.on{background:linear-gradient(#ffd84a,#ffae0c)}
.fchip.on small{color:#5a3a00}
.mpitch{position:relative;height:min(440px,62vh);min-height:360px;border-radius:14px;border:3px solid #0a1636;background:repeating-linear-gradient(#3fa04a 0 33px,#37913f 33px 66px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 0 #0a1636;margin:4px 0 6px;overflow:hidden}
.mpitch::before{content:'';position:absolute;left:0;right:0;top:12%;height:3px;background:rgba(255,255,255,.6)}
.mpitch::after{content:'';position:absolute;left:30%;right:30%;bottom:0;height:46px;border:3px solid rgba(255,255,255,.6);border-bottom:0}
.mslot{position:absolute;width:min(64px,21%);transform:translate(-50%,-50%);transition:left .35s,top .35s}
.mslot .cw{gap:1px}
.mslot .lbl{text-align:center;font-size:10px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.mslot .oop{color:#ff9a9a}
.mslot.pick .card{animation:pickGlow .8s infinite}
@keyframes pickGlow{50%{box-shadow:0 0 0 2px #0a1636,0 0 0 6px #ffe066}}
.tovr{display:flex;justify-content:space-between;align-items:center;font-size:15px;padding:0 4px}
.tovr b{color:var(--gold);font-size:20px}
.deck6{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.deck6 .cname{font-size:9px}
.tabs{display:flex;gap:6px;margin:12px 0 8px}
.tab{flex:1;border-radius:11px;padding:8px 4px;background:linear-gradient(#3b6fd0,#244e9e);border:3px solid #0a1636;box-shadow:0 3px 0 #0a1636}
.tab b{font-weight:400;font-size:14px}
.tab.on{background:linear-gradient(#5fb0ff,#2f7bff)}
.found{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#1f3e86,#2a56b0);border:3px solid #0a1636;border-radius:12px;padding:8px 10px;margin:14px 0 8px}
.found b{font-size:17px}.found small{display:block;color:#8fe0ff;font-size:12px;font-family:'Lilita One',sans-serif}
/* vestuario */
.locker{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px;margin-bottom:6px}
.locker .jer{width:140px;filter:drop-shadow(0 6px 0 rgba(10,22,54,.6));animation:bob 3s ease-in-out infinite}
.locker .boot{width:110px;filter:drop-shadow(0 6px 0 rgba(10,22,54,.6));animation:bob 3s ease-in-out .5s infinite}
.cos{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:12px;background:rgba(10,22,54,.45);border:3px solid #0a1636;position:relative}
.cos svg{width:72%}
.cos.on{border-color:#3ccf5a;box-shadow:0 0 0 2px #3ccf5a}
.cos .pr{font-size:11px;background:linear-gradient(#6fe36f,#25a83c);border:2px solid #0a1636;border-radius:8px;padding:1px 6px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.cos .pr.eq{background:linear-gradient(#5fb0ff,#2a6fe0)}
.cos.lk svg{filter:grayscale(.6) brightness(.7)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
/* tienda */
.shop-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:12px;background:linear-gradient(#2f5cb8,#1e3f86);border:3px solid #0a1636;box-shadow:0 4px 0 #0a1636}
.shop-it .pack{width:64%}
.shop-it.kit-it svg{width:70%}
.shop-it b{font-size:13px;text-align:center}
.price{font-size:13px;background:linear-gradient(#6fe36f,#25a83c);border:2px solid #0a1636;border-radius:9px;padding:2px 10px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.free{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:linear-gradient(90deg,#2f5cb8,#5a2ed6);border:3px solid #0a1636;box-shadow:0 4px 0 #0a1636}
.free .pack{width:58px;flex:none}
.free div{flex:1}.free b{font-size:18px;display:block}.free small{color:var(--muted)}
/* ranking */
.rk{display:flex;flex-direction:column;gap:4px}
.rrow{display:grid;grid-template-columns:38px 30px 1fr auto;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;background:rgba(10,22,54,.45);border:2px solid #0a1636}
.rrow .pos{font-size:15px;text-align:center}
.rrow:nth-child(1) .pos{color:#ffd84a}.rrow:nth-child(2) .pos{color:#dfe7f2}.rrow:nth-child(3) .pos{color:#e09a5a}
.rrow .av{font-size:20px;text-align:center}
.rrow .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .nm small{display:block;font-size:10.5px;color:var(--muted)}
.rrow .tr{font-size:15px;color:var(--gold)}
.rrow.me{background:linear-gradient(90deg,#2f7bff,#1d4fb0);border-color:#ffe066}
.mepin{position:sticky;bottom:-16px;padding-top:8px;background:linear-gradient(transparent,var(--bg) 40%)}
.note{font-family:system-ui,sans-serif;font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0}
/* modales */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,12,35,.75);display:flex;align-items:center;justify-content:center;padding:12px}
.modal.dark{background:rgba(2,4,14,.96)}
#mbox{width:100%;max-width:430px;max-height:100%;overflow:auto}
.mpanel{background:linear-gradient(#3268c8,#1f4592);border:3px solid #0a1636;border-radius:18px;padding:12px;box-shadow:0 6px 0 #0a1636,0 20px 40px rgba(0,0,0,.5);position:relative;animation:popIn .28s cubic-bezier(.2,1.5,.4,1)}
@keyframes popIn{from{transform:scale(.7);opacity:0}}
.mclose{position:absolute;top:-10px;right:-8px;width:36px;height:36px;border-radius:50%;background:linear-gradient(#ff7a85,#d8293c);border:3px solid #0a1636;font-size:18px;box-shadow:0 3px 0 #0a1636;z-index:2}
.mtitle{text-align:center;font-size:22px;margin:-2px 0 10px}
.cd-top{display:flex;gap:12px;align-items:center}
.cd-top .cw{width:110px;flex:none}
.cd-info{flex:1}.cd-info .rar{font-size:13px}.cd-info b{display:block;font-size:22px}.cd-info small{color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.st{display:grid;grid-template-columns:36px 1fr 26px;align-items:center;gap:7px;font-size:13px}
.st .sb{height:10px;border-radius:6px;background:#0a1636;overflow:hidden}.st .sb i{display:block;height:100%}
.desc{font-family:system-ui,sans-serif;font-size:13px;line-height:1.4;color:#e6edff;margin:10px 2px}
.fd{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-family:system-ui,sans-serif;font-size:12px}
.fd div{border-radius:9px;padding:6px 8px;line-height:1.3}.fd span{display:block;font-family:'Lilita One',sans-serif;font-size:13px}
.fd .f{background:rgba(60,207,90,.2);border:2px solid rgba(60,207,90,.5)}.fd .d{background:rgba(255,77,94,.2);border:2px solid rgba(255,77,94,.5)}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.lockmsg{font-family:system-ui,sans-serif;font-size:13px;text-align:center;color:#dfe7ff;margin:12px 4px}
.slotpick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}
.slotpick button{display:flex;flex-direction:column;gap:2px;font-size:10px;align-items:center}
.ep label{display:block;font-size:14px;margin:10px 0 5px}
.ep input,.ep select{width:100%;font-family:inherit;font-size:17px;padding:9px 11px;border-radius:11px;border:3px solid #0a1636;background:#0f2659;color:#fff}
.avg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.avg button{aspect-ratio:1;font-size:21px;border-radius:9px;background:rgba(10,22,54,.5);border:2px solid #0a1636}
.avg button.on,.colg button.on{box-shadow:0 0 0 3px #ffe066}
.colg{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.colg button{aspect-ratio:1;border-radius:50%;border:3px solid #0a1636}
.set{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:2px solid rgba(10,22,54,.4)}
.set>div:first-child{flex:1}.set b{display:block;font-size:16px}.set small{color:var(--muted);font-size:11.5px}
.tgl{width:54px;height:30px;border-radius:16px;background:#0a1636;position:relative;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#7a8bb3;transition:.15s}
.tgl.on{background:#1f7a33}.tgl.on i{left:27px;background:#7cf07c}
.seg{display:flex;background:#0a1636;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 8px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg button.on{background:linear-gradient(#5fb0ff,#2a6fe0);color:#fff}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.pfs{background:rgba(10,22,54,.45);border:2px solid #0a1636;border-radius:10px;padding:7px 9px;display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:center}
.pfs span{grid-row:span 2;font-size:21px}.pfs b{font-size:18px}.pfs small{font-size:11px;color:var(--muted)}
.lg{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;border:3px solid #0a1636;margin-bottom:7px;background:linear-gradient(110deg,var(--c1),var(--c2));box-shadow:0 3px 0 #0a1636}
.lg .mdio{width:64px;height:54px;flex:none;perspective:200px}
.lg .mdio div{width:44px;height:56px;margin:0 auto;transform:rotateX(50deg);border-radius:5px;background:repeating-linear-gradient(var(--g1) 0 7px,var(--g2) 7px 14px);border:3px solid var(--st);box-shadow:0 0 0 2px #0a1636,0 8px 0 var(--side)}
.lg>div:nth-child(2){flex:1}.lg b{display:block;font-size:17px}.lg small{color:rgba(255,255,255,.88);font-size:11.5px}
.lg.cur{box-shadow:0 0 0 3px #ffe066,0 3px 0 #0a1636}.lg.lk{filter:grayscale(.8) brightness(.6)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;background:rgba(10,22,54,.95);border:3px solid var(--gold);padding:8px 16px;border-radius:12px;font-size:15px;animation:toast 2.2s forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
#confirm{z-index:80}
/* apertura FIFA */
.po{position:relative;min-height:min(560px,90vh);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.po .beams{pointer-events:none;z-index:0;position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px;background:repeating-conic-gradient(var(--bc,rgba(255,210,80,.35)) 0 6deg,transparent 6deg 18deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%);mask:radial-gradient(circle,#000 10%,transparent 60%);animation:rot 9s linear infinite;opacity:0;transition:opacity .5s}
.po.lit .beams{opacity:1}
.po>*:not(.beams):not(.spark){position:relative;z-index:1}
@keyframes rot{to{transform:rotate(360deg)}}
.po .bigpack{width:170px;position:relative;z-index:2;transition:transform .4s}
.po .bigpack.shake{animation:pshake .7s}
@keyframes pshake{10%,50%,90%{transform:rotate(-6deg) scale(1.05)}30%,70%{transform:rotate(6deg) scale(1.08)}100%{transform:scale(1.15)}}
.po .bigpack.torn .pk-top{animation:tear .5s forwards}
@keyframes tear{to{transform:translate(60px,-120px) rotate(40deg);opacity:0}}
.po .bigpack.gone{animation:packDown .5s forwards}
@keyframes packDown{to{transform:translateY(300px) scale(.8);opacity:0}}
.po .hint{position:relative;z-index:2;margin-top:18px;font-size:16px;color:#dfe7ff}
.clue{position:relative;z-index:2;font-size:44px;animation:clueIn .45s cubic-bezier(.2,1.6,.4,1);text-align:center}
.clue small{display:block;font-size:16px;font-family:'Lilita One',sans-serif;-webkit-text-stroke:2.5px #0a1636;paint-order:stroke fill}
@keyframes clueIn{from{transform:scale(2.5);opacity:0}}
.flip{width:150px;perspective:900px;position:relative;z-index:2}
.flip .inner{position:relative;transform-style:preserve-3d;animation:flipIn .9s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes flipIn{0%{transform:rotateY(180deg) scale(.4)}100%{transform:rotateY(0) scale(1)}}
.flip .back{position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);border-radius:9px;background:linear-gradient(160deg,var(--c1,#ffe27a),var(--c2,#c98a00));border:3px solid #0a1636}
.flip .front{backface-visibility:hidden}
.wo-name{position:relative;z-index:2;font-size:28px;margin-top:12px;text-align:center;animation:clueIn .5s .5s both}
.wo-name small{display:block;font-size:14px;color:#dfe7ff}
.allc{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;padding:6px}
.allc .it{animation:flipSmall .5s both}
@keyframes flipSmall{from{transform:rotateY(90deg) scale(.6);opacity:0}}
.allc .it b{display:block;text-align:center;font-size:12px;margin-top:2px;-webkit-text-stroke:2px #0a1636;paint-order:stroke fill}
.spark{position:absolute;left:50%;top:45%;width:9px;height:9px;border-radius:2px;animation:spark .9s ease-out forwards;z-index:3;pointer-events:none}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(220deg);opacity:0}}

/* carta con arte estilo Clash */
.card.art{justify-content:flex-end;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.35),transparent 60%),linear-gradient(170deg,#6f9ae8,#2a4fa8)}
.card.art.r-rara{background:radial-gradient(circle at 50% 35%,rgba(255,240,200,.4),transparent 60%),linear-gradient(170deg,#ffb35c,#b8561a)}
.card.art.r-epica{background:radial-gradient(circle at 50% 35%,rgba(240,200,255,.4),transparent 60%),linear-gradient(170deg,#c27bff,#5a1ea8)}
.card.art.r-legendaria{background:radial-gradient(circle at 50% 35%,rgba(255,250,200,.5),transparent 60%),linear-gradient(170deg,#ffe27a,#c97a00 70%,#7a3ad8)}
.card .c-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;pointer-events:none}
.card.art .c-face{flex:1}
.card .c-gem{position:absolute;top:-1px;left:50%;width:14px;height:14px;margin-left:-7px;transform:rotate(45deg);background:linear-gradient(135deg,#fff6b0,#e0a800);border:2px solid #0a1636;z-index:2;box-shadow:0 0 6px rgba(255,220,80,.8)}
.card.art.r-comun .c-gem{background:linear-gradient(135deg,#e6efff,#8aa0c8)}.card.art.r-rara .c-gem{background:linear-gradient(135deg,#ffd9a8,#e07a1a)}.card.art.r-epica .c-gem{background:linear-gradient(135deg,#f0c8ff,#9a3ae0)}
.card.art::after{z-index:1}
.card.art .c-ovr,.card.art .c-pos,.card.art .c-lvl,.card.art .lockic{z-index:2}
.card.art .c-lvl{position:relative}
/* ficha a pantalla completa */
.ficha{background:linear-gradient(#2b5fc2,#173a85);border:3px solid #0a1636;border-radius:18px;padding:10px 12px 14px;box-shadow:0 6px 0 #0a1636,0 20px 40px rgba(0,0,0,.5);animation:popIn .28s cubic-bezier(.2,1.5,.4,1);position:relative;overflow:hidden}
.fh{display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px}.fh b{font-size:24px}.fh .mclose{position:absolute;right:-4px;top:-4px}
.ftop{display:flex;gap:10px;align-items:center}.fcard{width:84px;flex:none}.flv{flex:1;display:flex;flex-direction:column;gap:5px}.flv b{font-size:20px;color:#ffe066}.flv small{color:#cfe0ff;font-size:12px}
.fbar{height:24px;border-radius:12px;background:#0a1636;border:3px solid #0a1636;position:relative;overflow:hidden}.fbar i{display:block;height:100%;background:linear-gradient(#5fb0ff,#2a6fe0)}.fbar.up i{background:linear-gradient(#7cf07c,#28a83c)}.fbar span{position:absolute;inset:0;text-align:center;font-size:14px;line-height:18px}
.fstage{position:relative;height:min(52vh,420px);margin:8px -12px 4px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.fart{position:relative;z-index:2;max-height:100%;max-width:92%;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.45));animation:fartIn .6s cubic-bezier(.2,1.4,.4,1),bob 3.2s ease-in-out .6s infinite}
.fsvg{width:60%}
@keyframes fartIn{from{transform:translateY(40px) scale(.8);opacity:0}}
.smoke{position:absolute;border-radius:50%;filter:blur(18px);opacity:.55;animation:smoke 7s ease-in-out infinite}
.smoke.s1{width:70%;height:55%;left:-5%;bottom:5%;background:rgba(230,240,255,.55)}
.smoke.s2{width:65%;height:50%;right:-8%;bottom:12%;background:rgba(210,225,255,.5);animation-delay:-2.3s}
.smoke.s3{width:80%;height:40%;left:10%;bottom:-8%;background:rgba(255,255,255,.45);animation-delay:-4.6s}
@keyframes smoke{50%{transform:translate(4%,-6%) scale(1.12);opacity:.75}}
.fglow{position:absolute;left:50%;top:45%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 65%)}
.ficha.r-rara .fglow{background:radial-gradient(circle,rgba(255,180,90,.55),transparent 65%)}.ficha.r-epica .fglow{background:radial-gradient(circle,rgba(200,120,255,.55),transparent 65%)}.ficha.r-legendaria .fglow{background:radial-gradient(circle,rgba(255,220,90,.65),transparent 65%)}
.ember{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:2px;background:#ffd36b;box-shadow:0 0 8px #ff9a2a;z-index:1;animation:ember 3s linear infinite;opacity:0}
.ficha.r-comun .ember{background:#dfeaff;box-shadow:0 0 8px #9fc0ff}.ficha.r-epica .ember{background:#e7b8ff;box-shadow:0 0 8px #b04dff}
@keyframes ember{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(-380px) rotate(260deg);opacity:0}}
.fbadges{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:relative;z-index:3}
.fbadges div{display:flex;flex-direction:column;align-items:center;background:linear-gradient(#ffd84a,#e8a400);border:3px solid #0a1636;border-radius:10px;padding:2px 4px 4px;box-shadow:0 3px 0 #0a1636}
.fbadges span{font-size:11px;color:#fff}.fbadges b{font-size:15px;background:#1d3a7f;border-radius:6px;width:100%;text-align:center;margin-top:2px;padding:2px 0;-webkit-text-stroke:2.5px #0a1636}
@media (prefers-reduced-motion: reduce){.smoke,.ember,.fart{animation:none!important}.ember{display:none}}
#cards .card .hi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;border-radius:6px}
#cards .card.hasart{justify-content:flex-end;padding:0}
#cards .card.hasart .nm{position:relative;z-index:1;width:100%;background:linear-gradient(transparent,rgba(10,22,54,.9));padding:6px 2px 2px}
#cards .card .cost{z-index:2}
.pw-art{display:block;width:100%;max-height:42vh;object-fit:cover;border-radius:12px;border:3px solid #0a1636;margin:4px 0 10px;box-shadow:0 4px 0 #0a1636;animation:fartIn .5s cubic-bezier(.2,1.4,.4,1)}
.card.art .drop{z-index:3}
.arena-img{width:min(260px,70vw);display:block;filter:drop-shadow(0 18px 14px rgba(0,0,0,.45));animation:arenaFloat 4s ease-in-out infinite}
@keyframes arenaFloat{50%{transform:translateY(-8px)}}
.mdio-img{width:76px;flex:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4))}
@media (prefers-reduced-motion: reduce){.arena-img{animation:none}}

/* inicio fijo: sin scroll, se adapta al alto de la pantalla */
#sc-battle.on{display:flex;flex-direction:column;overflow:hidden;padding:4px 10px 8px}
#sc-battle .hb-row{flex:none}
#sc-battle .arena-wrap{flex:1 1 auto;min-height:0;margin:4px 0 0;justify-content:center}
#sc-battle .dio{min-height:0;min-width:0;height:auto}

function botName(r){return NAMEA[Math.floor(r()*NAMEA.length)]+(r()<.6?NAMEB[Math.floor(r()*NAMEB.length)]:Math.floor(r()*99));}
function ranking(local){
  const day=Math.floor(Date.now()/864e5),r=rng(local?hexN('#'+(save.country.charCodeAt(0)*999+save.country.charCodeAt(1)).toString(16).padStart(6,'0').slice(0,6))+7:12345);
  const top=local?4200:6200,list=[];
  for(let i=0;i<50;i++){const t=Math.round(top-i*(local?55:48)-r()*30+((day*7+i)%5));list.push({n:botName(r),av:AVATARS[Math.floor(r()*AVATARS.length)],c:local?save.country:Object.keys(COUNTRIES)[Math.floor(r()*17)],t});}
  list.sort((a,b)=>b.t-a.t);
  const N=local?18000:420000,me={n:save.name,av:save.avatar,c:save.country,t:save.trophies,me:true};
  let rank;const idx=list.findIndex(x=>save.trophies>x.t);
  if(idx>=0){list.splice(idx,0,me);list.length=50;rank=idx+1;}else rank=Math.max(51,Math.round(N*Math.exp(-save.trophies/700)));
  return{list,rank,me};
}

function iconize(root){if(!root||!document.body.contains(root)&&root!==document.body)return;

    x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
    for(let i=0;i<BGFX.p.length;i++){const p=BGFX.p[i];p.y-=p.v*dt*1.6;p.ph+=dt*2;if(p.y<-.05){BGFX.p[i]=np(false);continue;}
      const px=(p.x+Math.sin(p.ph*.4)*.015)*w,py=p.y*h,tw=.55+.45*Math.sin(p.ph*1.7);
      if(p.st){const r=p.r*2.6*tw;x.globalAlpha=p.a*tw;x.fillStyle='#fff';x.beginPath();x.moveTo(px,py-r);x.quadraticCurveTo(px,py,px+r,py);x.quadraticCurveTo(px,py,px,py+r);x.quadraticCurveTo(px,py,px-r,py);x.quadraticCurveTo(px,py,px,py-r);x.fill();}
      else{const g=x.createRadialGradient(px,py,0,px,py,p.r*3);g.addColorStop(0,'rgba(255,255,255,'+(p.a*tw)+')');g.addColorStop(1,'rgba(255,255,255,0)');x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.arc(px,py,p.r*3,0,6.3);x.fill();}}
    x.globalAlpha=1;};
  requestAnimationFrame(tick);}

(function(){const boot=document.getElementById('boot');if(!boot)return;{const art=boot.querySelector('.bt-art'),im=new Image();im.onload=()=>{art.style.setProperty('--art','url(assets/ui/carga.webp?v=57)');art.classList.add('img');};im.src='assets/ui/carga.webp?v=57';}const fill=document.getElementById('btFill'),pct=document.getElementById('btPct'),st=document.getElementById('btSt'),tip=document.getElementById('btTip');
  const TIPS=['Suelta el tiro en la franja dorada para un ¡TIRO PERFECTO!','El súper tiro cuesta 3 de energía: úsalo cuando cuente.','Cambia de dirección de golpe para dar un arrancón.','La bomba avisa con un círculo rojo: ¡sal de ahí!','En los últimos 45 segundos la energía se carga al doble.','Usa Cuerpo para empujar al rival y quedarte con el balón.','El aro blanco en el pasto marca dónde va a caer el balón.','Con Escudo tu portería se cubre de energía unos segundos.'];
  let ti=Math.floor(Math.random()*TIPS.length);tip.textContent=TIPS[ti];
  const tipT=setInterval(()=>{tip.style.opacity=0;setTimeout(()=>{ti=(ti+1)%TIPS.length;tip.textContent=TIPS[ti];tip.style.opacity=1;},300);},3200);
  const t0=performance.now();let shown=0,done=false;
  const prog=()=>{let p=.12;if(typeof THREE!=='undefined')p+=.1;if(ANIMLIB)p+=.18;
    const tot=MODEL_IDS.length||1,fin=MODEL_IDS.filter(id=>MSTATUS[id]&&MSTATUS[id]!=='cargando').length;p+=.6*fin/tot;
    st.textContent=fin<tot?'Cargando personajes '+fin+'/'+tot+'…':(ANIMLIB?'¡Listo!':'Cargando animaciones…');return Math.min(1,p);};
  const tick=setInterval(()=>{const target=done?1:Math.min(.97,prog());shown+=(target-shown)*.35;if(target-shown<.004)shown=target;
    fill.style.width=(shown*100).toFixed(1)+'%';pct.textContent=Math.round(shown*100)+'%';
    if(done&&shown>=.999&&performance.now()-t0>1800){clearInterval(tick);clearInterval(tipT);boot.classList.add('out');setTimeout(()=>boot.remove(),520);window.BOOT_DONE=true;if(window.NET&&NET.afterBoot)NET.afterBoot();}},90);
  Promise.race([modelsReady,sleep(25000)]).catch(()=>{}).then(()=>{done=true;});
})();
