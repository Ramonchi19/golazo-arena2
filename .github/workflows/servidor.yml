name: Publicar servidor

on:
  push:
    branches: [ main ]
    paths: [ 'server/**', 'assets/sim/**', '.github/workflows/servidor.yml' ]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b05619abe39ffbb5e8656836f50fca5e
          workingDirectory: server
